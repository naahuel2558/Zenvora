<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENVORA | Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space Grotesk:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#39ff14',
                        background: '#0a0a0a',
                        surface: '#121212'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-background text-white min-h-screen">
    <!-- Nav -->
    <nav class="border-b border-white/5 py-8 px-10 flex justify-between items-center glass sticky top-0 z-50">
        <h1 class="text-2xl font-black uppercase italic tracking-tighter transition-all hover:text-primary">ZENVORA</h1>
        <div class="flex items-center gap-8">
            <span id="displayUsername" class="text-[10px] font-black uppercase tracking-[0.2em] text-white/40">Cargando...</span>
            <button onclick="logout()" class="text-[10px] font-black uppercase tracking-widest text-red-500 hover:text-white transition-all bg-red-500/10 px-4 py-2 rounded-lg">Cerrar SesiÃ³n</button>
        </div>
    </nav>

    <main class="p-10 max-w-6xl mx-auto">
        <header class="mb-16">
            <h2 class="text-6xl font-black uppercase italic tracking-tighter mb-4">Command <span class="text-primary">Center</span></h2>
            <p class="text-white/30 uppercase tracking-[0.4em] text-xs">GestionÃ¡ tus artÃ­culos y equipamiento</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <!-- Sidebar: User Info -->
            <div class="lg:col-span-1 space-y-8">
                <div class="glass p-10 rounded-[2.5rem] relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4">
                        <div class="w-2 h-2 bg-primary rounded-full animate-pulse shadow-[0_0_10px_#39ff14]"></div>
                    </div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/20 mb-6">User Profile</label>
                    <div class="w-24 h-24 bg-gradient-to-tr from-primary to-green-900 rounded-2xl mb-6 shadow-2xl"></div>
                    <h3 id="userTitle" class="text-3xl font-black uppercase mb-2 italic">Athlete</h3>
                    <p id="userEmail" class="text-white/40 text-xs font-sans">athlete@ZENVORA.pro</p>
                    
                    <div class="mt-10 pt-10 border-t border-white/5 space-y-4">
                         <div class="flex justify-between text-[10px] font-black uppercase tracking-widest">
                            <span class="text-white/20">Status</span>
                            <span class="text-primary">Elite Alpha</span>
                         </div>
                         <div class="flex justify-between text-[10px] font-black uppercase tracking-widest">
                            <span class="text-white/20">Posts</span>
                            <span id="postCount">0</span>
                         </div>
                    </div>
                </div>

                <div class="glass p-8 rounded-[2rem] border-primary/20">
                    <h4 class="text-sm font-black uppercase mb-4 text-primary italic">Quick Actions</h4>
                    <button onclick="openCreateModal()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-primary hover:text-black transition-all mb-3 text-left flex justify-between items-center">
                        + Nueva PublicaciÃ³n
                        <span>Ã¢â€ â€™</span>
                    </button>
                </div>
            </div>

            <!-- Content Area: Posts -->
            <div class="lg:col-span-2">
                <h4 class="text-[10px] font-black uppercase tracking-[0.3em] text-white/20 mb-8">Tus ArtÃ­culos Recientes</h4>
                <div id="postsContainer" class="space-y-6">
                    <!-- DinÃ¡mico -->
                </div>
            </div>
        </div>
    </main>

    <!-- Simple Modal para Crear Post (Mejorado luego si querÃ©s) -->
    <div id="createModal" class="fixed inset-0 bg-black/90 z-[100] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="glass w-full max-w-xl p-10 rounded-[3rem] shadow-2xl relative">
            <button onclick="closeCreateModal()" class="absolute top-8 right-8 text-white/30 hover:text-white transition-all text-2xl">&times;</button>
            <h3 class="text-3xl font-black uppercase italic mb-8">Publicar en el Arsenal</h3>
            <form id="postForm" class="space-y-6">
                <div>
                    <label class="text-[10px] font-black uppercase mb-2 block text-white/30 tracking-widest">TÃ­tulo</label>
                    <input type="text" id="postTitle" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-primary transition-all">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase mb-2 block text-white/30 tracking-widest">Contenido (Elite Markdown)</label>
                    <textarea id="postContent" required rows="5" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-primary transition-all font-sans text-sm"></textarea>
                </div>
                <button type="submit" class="w-full bg-primary text-black p-5 rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-white transition-all shadow-[0_15px_30px_-5px_rgba(57,255,20,0.4)]">
                    Desplegar Articulo
                </button>
            </form>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');

        if (!userId) window.location.href = 'login.html';

        document.getElementById('displayUsername').innerText = `ID: ${userId} | ${username}`;
        document.getElementById('userTitle').innerText = username;

        async function fetchMyPosts() {
            const res = await fetch('/posts');
            const allPosts = await res.json();
            const myPosts = allPosts.filter(p => p.userId === userId);
            
            document.getElementById('postCount').innerText = myPosts.length;
            
            const container = document.getElementById('postsContainer');
            if (myPosts.length === 0) {
                container.innerHTML = `<div class="glass p-10 rounded-3xl text-center text-white/20 uppercase tracking-widest text-[10px] border-dashed border-white/10">No hay contenido desplegado en el arsenal</div>`;
                return;
            }

            container.innerHTML = myPosts.map(p => `
                <div class="glass p-8 rounded-3xl flex justify-between items-center group hover:border-primary/30 transition-all">
                    <div>
                        <span class="text-primary text-[9px] font-black uppercase tracking-widest mb-2 block">${p.category}</span>
                        <h4 class="text-xl font-black uppercase tracking-tight">${p.title}</h4>
                        <p class="text-white/20 text-[10px] uppercase mt-2">${new Date(p.createdAt).toLocaleDateString()}</p>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="deletePost('${p.id}')" class="text-white/10 hover:text-red-500 transition-all">ELIMINAR</button>
                    </div>
                </div>
            `).join('');
        }

        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); document.getElementById('createModal').classList.add('flex'); }
        function closeCreateModal() { document.getElementById('createModal').classList.remove('flex'); document.getElementById('createModal').classList.add('hidden'); }

        document.getElementById('postForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId,
                    title: postTitle.value,
                    content: postContent.value,
                    category: 'Equipamiento'
                })
            });
            if (res.ok) {
                closeCreateModal();
                fetchMyPosts();
                document.getElementById('postForm').reset();
            }
        };

        async function deletePost(id) {
            if(!confirm('Ã‚Â¿Realmente querÃ©s purgar este articulo?')) return;
            const res = await fetch(`/posts/${id}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId })
            });
            if (res.ok) fetchMyPosts();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        fetchMyPosts();
    </script>
</body>
</html>
