<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENVORA | Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space Grotesk:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background: #0D0D0D; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen">
    <nav class="border-b border-white/5 py-10 px-10 flex justify-between items-center">
        <a href="index.html" class="text-3xl font-black uppercase italic tracking-tighter">ZENVORA</a>
        <div class="flex gap-10">
            <a href="login.html" class="text-[10px] font-black uppercase tracking-widest text-green-500">Admin Login</a>
        </div>
    </nav>

    <header class="py-20 px-10 text-center">
        <h1 class="text-7xl md:text-9xl font-black uppercase tracking-tighter italic leading-none">The <span class="text-green-500">Arsenal</span></h1>
        <p class="mt-8 text-white/40 uppercase tracking-[0.4em] text-xs">Blog de entrenamiento y biohacking de elite</p>
    </header>

    <main class="px-10 max-w-[1400px] mx-auto pb-40">
        <div id="blogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- DinÃ¡mico -->
        </div>
    </main>

    <script>
        async function fetchBlog() {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            const grid = document.getElementById('blogGrid');
            
            if(posts.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-white/20 uppercase tracking-widest py-20">No hay artÃ­culos todavÃ­a. El arsenal estÃ¡ vacÃ­o.</p>';
                return;
            }

            grid.innerHTML = posts.map(p => `
                <article class="glass p-8 rounded-[3rem] hover:border-green-500/50 transition-all group">
                    <div class="aspect-square rounded-[2rem] overflow-hidden mb-8 border border-white/10">
                        <img src="${p.images?.[0] || 'https://placehold.co/600x600/0d0d0d/333?text=ZENVORA'}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700 transform group-hover:scale-110">
                    </div>
                    <span class="text-green-500 text-[10px] font-black uppercase tracking-widest mb-4 block">${p.category}</span>
                    <h2 class="text-3xl font-black uppercase tracking-tighter mb-6 leading-none">${p.title}</h2>
                    <p class="text-white/40 text-sm line-clamp-3 mb-8 font-sans">${p.content}</p>
                    <div class="flex justify-between items-center pt-6 border-t border-white/5">
                        <span class="text-[10px] text-white/20 uppercase tracking-widest">Escrito por ${p.username}</span>
                        <a href="#" class="text-xs font-black uppercase text-green-500 tracking-widest hover:text-white transition-all">Leer mÃ¡s Ã¢â€ â€™</a>
                    </div>
                </article>
            `).join('');
        }
        fetchBlog();
    </script>
</body>
</html>
