<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENVORA | Blog de Elite</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { 
                extend: { 
                    colors: { "primary": "#39ff14", "background": "#131313", "surface": "#0A0A0A" },
                    fontFamily: { 'space': ['Space Grotesk', 'sans-serif'], 'inter': ['Inter', 'sans-serif'] }
                } 
            }
        }
    </script>
    <style>
        .filter-btn.active { border-color: #39ff14; color: #39ff14; }
    </style>
</head>
<body class="bg-background text-white min-h-screen flex flex-col font-inter">
    <div id="navbar-container"></div>

    <main class="flex-grow pt-20 px-10">
        <section class="container mx-auto">
            <header class="mb-20 text-center">
                <span class="text-primary font-black uppercase tracking-[0.4em] text-xs mb-4 block">CONOCIMIENTO ES PODER</span>
                <h1 class="font-space text-7xl font-black uppercase tracking-tighter mb-4 italic leading-none">EL BLOG</h1>
                <p class="text-white/40 text-sm uppercase tracking-widest mb-12">Optimización biológica y herramientas de dominación.</p>
                
                <!-- Filtros Blog -->
                <div id="blog-categories" class="flex flex-wrap justify-center gap-4">
                    <button onclick="filterBlog('Todos')" class="filter-btn active border border-white/10 px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-widest hover:border-primary transition-all">Todos</button>
                </div>
            </header>

            <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 mb-20"></div>
        </section>
    </main>

    <footer class="bg-black py-20 border-t border-white/5 px-10 text-center">
        <p class="text-white/20 text-[10px] uppercase font-black tracking-widest">© 2026 ZENVORA. Laburo de Elite.</p>
    </footer>

    <script type="module">
        import { renderNavbar } from '../components/renderNavbar.js';
        renderNavbar('blog');
        
        let allPosts = [];

        window.filterBlog = (category) => {
            const grid = document.getElementById('posts-grid');
            const btns = document.querySelectorAll('.filter-btn');
            
            btns.forEach(b => {
                if(b.textContent === category) b.classList.add('active');
                else b.classList.remove('active');
            });

            const filtered = category === 'Todos' ? allPosts : allPosts.filter(p => p.category === category);
            grid.innerHTML = filtered.map(renderPostCard).join('');
        };

        function renderPostCard(p) {
            return `
                <article onclick="window.location.href='post.html?id=${p.id}'" class="group cursor-pointer bg-surface/50 border border-white/5 rounded-3xl overflow-hidden hover:border-primary/30 transition-all shadow-2xl">
                    <div class="relative aspect-video overflow-hidden bg-black">
                        <img src="${p.images[0]}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 group-hover:scale-110 transition-all duration-700">
                        <div class="absolute top-6 left-6 bg-black/80 px-3 py-1 border border-white/10 text-[10px] font-black text-primary tracking-widest uppercase rounded-full">${p.category}</div>
                    </div>
                    <div class="p-8">
                        <h3 class="font-space text-2xl font-black uppercase tracking-tighter mb-4 group-hover:text-primary transition-all">${p.title}</h3>
                        <p class="text-white/40 text-sm line-clamp-3 mb-6">${p.content}</p>
                        <div class="flex justify-between items-center text-[10px] uppercase font-black tracking-widest text-white/20">
                            <span>Por ${p.username}</span>
                            <span>Leer Más →</span>
                        </div>
                    </div>
                </article>
            `;
        }

        async function init() {
            try {
                const res = await fetch('/api/posts');
                allPosts = await res.json();
                
                const categories = ['Todos', ...new Set(allPosts.map(p => p.category))];
                const catContainer = document.getElementById('blog-categories');
                catContainer.innerHTML = categories.map(c => `
                    <button onclick="filterBlog('${c}')" class="filter-btn ${c === 'Todos' ? 'active' : ''} border border-white/10 px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-widest hover:border-primary transition-all">${c}</button>
                `).join('');

                filterBlog('Todos');
            } catch (e) { console.error(e); }
        }
        init();
    </script>
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1313162720725181');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1313162720725181&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</body>
</html>
