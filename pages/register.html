<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENVORA | Registro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { 
                extend: { 
                    colors: { "primary": "#39ff14", "background": "#131313", "surface": "#0A0A0A" },
                    fontFamily: { 'space': ['Space Grotesk', 'sans-serif'], 'inter': ['Inter', 'sans-serif'] }
                } 
            }
        }
    </script>
</head>
<body class="bg-background text-white min-h-screen flex flex-col font-inter">
    <div id="navbar-container"></div>

    <main class="flex-grow flex items-center justify-center p-10">
        <div class="w-full max-w-md bg-surface border border-white/5 p-12 rounded-3xl shadow-2xl">
            <h1 class="font-space text-4xl font-black uppercase tracking-tighter mb-2 italic">REGISTRO</h1>
            <p class="text-white/40 text-xs uppercase tracking-widest mb-10">Unite a la elite de Zenvora</p>
            
            <form id="registerForm" class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase font-black tracking-widest text-white/40 mb-2">Usuario</label>
                    <input type="text" name="username" required class="w-full bg-black border border-white/10 rounded-xl px-6 py-4 text-white focus:border-primary transition-all outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-black tracking-widest text-white/40 mb-2">Email</label>
                    <input type="email" name="email" required class="w-full bg-black border border-white/10 rounded-xl px-6 py-4 text-white focus:border-primary transition-all outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-black tracking-widest text-white/40 mb-2">Contraseña</label>
                    <input type="password" name="password" required class="w-full bg-black border border-white/10 rounded-xl px-6 py-4 text-white focus:border-primary transition-all outline-none">
                </div>
                <button type="submit" class="w-full bg-white text-black py-4 rounded-xl font-black uppercase text-xs tracking-[0.2em] hover:bg-primary transition-all">CREAR CUENTA</button>
            </form>
            
            <div class="mt-10 pt-10 border-t border-white/5 text-center">
                <p class="text-white/20 text-[10px] uppercase font-black tracking-widest">¿Ya sos parte? <a href="login.html" class="text-primary hover:underline">Logueate acá</a></p>
            </div>
        </div>
    </main>

    <script type="module">
        import { renderNavbar } from '../components/renderNavbar.js';
        renderNavbar('');
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    alert('Cuenta creada. Ahora logueate.');
                    window.location.href = 'login.html';
                } else {
                    alert(result.message || 'Error al registrar');
                }
            } catch (error) { console.error(error); }
        });
    </script>

</body>
</html>
